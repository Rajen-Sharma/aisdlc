name: Protected verifier qualification
on:
  push:
    branches: ['build/verifier-qualification', 'build/verifier-resource-boundaries', 'build/verifier-operation-drain']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.0
      - name: Qualify trusted controller against synthetic adversaries
        run: node scripts/verifier-qualification.mjs
      - name: Check reconciliation fail-closed behavior
        run: node --test tests/verifier-recovery.test.mjs
      - name: Qualify controller death and fresh-process reconciliation
        run: node scripts/verifier-crash-qualification.mjs
      - name: Qualify pending operation drain after controller death
        run: node scripts/verifier-operation-qualification.mjs
      - name: Preserve actual qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verifier-${{ github.sha }}-${{ github.run_id }}
          path: docs/evidence/verifier/*.json
          retention-days: 30
