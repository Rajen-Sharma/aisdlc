name: Verify delivery platform
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, 'build/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic credentials for this disposable CI database, never deployment credentials.
      DATABASE_URL: postgresql://cms:ci-only-not-for-deployment@127.0.0.1:55432/cms
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Prepare fresh run evidence
        run: |
          mkdir -p docs/evidence/github-ci
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('docs/evidence/github-ci/run.json', JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,createdAt:new Date().toISOString()},null,2))"
      - name: Start pinned CI database with bounded diagnostics
        run: node scripts/ci-postgres.mjs start
      - run: npm ci
      - run: npm run setup
      - run: npm run seed
      - run: npm run typecheck
      - name: Recovery discovery and fail-closed checks
        run: node --test tests/recovery-discovery.test.mjs tests/verifier-recovery.test.mjs tests/qualification-docker-proxy.test.mjs tests/codex-trial-policy.test.mjs tests/codex-transport-guard.test.mjs tests/azure-trial-template.test.mjs
      - name: Integration tests
        run: npm test > docs/evidence/github-ci/integration-tests.log 2>&1
      - name: Publish safe integration diagnostics
        if: failure()
        run: node scripts/ci-test-summary.mjs
      - name: Dependency audit
        run: npm audit --json > docs/evidence/github-ci/dependency-audit.json
      - run: npm run import:demo
      - name: Optimized build
        run: npm run build > docs/evidence/github-ci/build.log 2>&1
      - run: npx playwright install --with-deps chromium
      - name: Start built app and verify browser journeys
        run: |
          node scripts/next.mjs start > .local/app.log 2> .local/app-error.log &
          node scripts/wait-http.mjs
          node scripts/browser-check.mjs --evidence-dir=docs/evidence/github-ci
          node scripts/pipeline-smoke.mjs --evidence-dir=docs/evidence/github-ci
          node scripts/sdlc-smoke.mjs --evidence-dir=docs/evidence/github-ci
          node scripts/delivery-browser.mjs --evidence-dir=docs/evidence/github-ci
          node --env-file=.env --import tsx scripts/ownership-browser.ts --evidence-dir=docs/evidence/github-ci
      - name: Remove owned CI database
        if: always()
        run: node scripts/ci-postgres.mjs stop
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/evidence/github-ci/
            .local/screenshots/*.png
          include-hidden-files: true
          retention-days: 30
